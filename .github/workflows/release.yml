name: Build & Release

on:
  push:
    branches: [main]

# Allow creating tags and releases, writing release assets
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # needed so gh can list all release tags

      # ── Java ────────────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle            # caches ~/.gradle between runs

      # ── Versioning ──────────────────────────────────────────────────────────
      - name: Compute next semver minor
        id: semver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          if [[ -z "$latest" || "$latest" == "null" ]]; then
            latest="v0.0.0"
          fi
          version="${latest#v}"
          IFS='.' read -r major minor _ <<< "$version"
          new_tag="v${major}.$((minor + 1)).0"
          new_version="${new_tag#v}"
          echo "tag=${new_tag}" >> "$GITHUB_OUTPUT"
          echo "version=${new_version}" >> "$GITHUB_OUTPUT"
          echo "Next release: ${new_tag}"

      # ── Android SDK ─────────────────────────────────────────────────────────
      # Use the same cmdline-tools zip as the Dockerfile so SDK 37 is available.
      - name: Install Android SDK 37
        run: |
          CMDTOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          SDK_ROOT="${HOME}/android-sdk"

          mkdir -p "${SDK_ROOT}/cmdline-tools"
          curl -sSfL "${CMDTOOLS_URL}" -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d /tmp
          mv /tmp/cmdline-tools "${SDK_ROOT}/cmdline-tools/latest"
          rm /tmp/cmdtools.zip

          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          yes | "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --licenses > /dev/null 2>&1 || true
          "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" \
            "platforms;android-37.0" \
            "build-tools;37.0.0"   \
            "platform-tools"

          # Expose to subsequent steps
          echo "ANDROID_HOME=${SDK_ROOT}"     >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "${SDK_ROOT}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${SDK_ROOT}/platform-tools"            >> "$GITHUB_PATH"

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace -PVERSION_NAME=${{ steps.semver.outputs.version }}
      # ── Package ──────────────────────────────────────────────────────────────
      - name: Rename APK and measure size
        id: apk
        run: |
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          APK_NAME="Kestrel-${{ steps.semver.outputs.tag }}.apk"
          cp "${APK_SRC}" "${APK_NAME}"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_ENV"

          # Human-readable size (e.g. "7.2 MB")
          bytes=$(wc -c < "${APK_SRC}")
          mb=$(awk "BEGIN {printf \"%.1f\", ${bytes}/1048576}")
          echo "apk_size=${mb} MB" >> "$GITHUB_OUTPUT"

      # ── Release ──────────────────────────────────────────────────────────────
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.semver.outputs.tag }}
          name: "Kestrel ${{ steps.semver.outputs.tag }}"
          body: |
            📦 **APK size: ${{ steps.apk.outputs.apk_size }}**
          generate_release_notes: true   # appended after body by the action
          files: ${{ env.apk_name }}
